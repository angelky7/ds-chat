name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 官方 setup-android 偶发失败，这里手动装，版本固定、行为可预期
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ds-chat.apk
          ls -lh out/ds-chat.apk

      # 自检：包名、启动 Activity、关键文件缺一不可，任何一项不对就让构建失败
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=out/ds-chat.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          unzip -l "$APK"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/badging.txt
          head -30 /tmp/badging.txt
          grep -q "package: name='com.angelky.dschat'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.angelky.dschat.MainActivity'" /tmp/badging.txt
          grep -q "application-label:'DeepSeek'" /tmp/badging.txt
          grep -q "application-icon-" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" /tmp/badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ds-chat-apk
          path: out/ds-chat.apk
          retention-days: 30

      # 固定标签，下载地址不变：releases/download/android-latest/ds-chat.apk
      - name: Publish to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/ds-chat.apk \
            --title "Android APK" \
            --notes "WebView 外壳，安装后打开即为线上站点。构建自 commit ${{ github.sha }}。"
