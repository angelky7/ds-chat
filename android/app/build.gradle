plugins {
    id 'com.android.application'
}

android {
    namespace 'com.angelky.dschat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.angelky.dschat'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            // 调试包也签名，方便直接安装
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            // 用 debug 签名，个人安装不需要额外配置 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

// 不引入任何 AndroidX 依赖：外壳只需要系统 WebView
dependencies {}
